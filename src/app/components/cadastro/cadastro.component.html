<div class="container-fluid login-container">
  <!-- Logo -->
  <div class="row justify-content-center">
    <div class="col-12 text-center mb-4">
      <img
        src="https://appvademecumlatam.cl/themes/focus2/images/logo-full.png"
        alt="Logo Eurofarma"
        height="120"
      />
    </div>
  </div>

  <!-- Form de cadastro -->
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6 login-box">
      <form [formGroup]="cadastroForm" (ngSubmit)="cadastrarColaborador()">
        <div class="row g-3 mb-4">
          <div class="col-12">
            <label class="form-label label text-start">Nome:</label>
            <input
              type="text"
              class="form-control custom-input"
              formControlName="nome"
              placeholder="Digite o nome completo"
              aria-label="Nome completo"
            />
          </div>

          <div class="col-12">
            <label class="form-label label text-start">Departamento:</label>
            <input
              type="text"
              class="form-control custom-input"
              formControlName="departamento"
              placeholder="Departamento"
              aria-label="Departamento"
            />
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <label class="form-label label text-start">Email:</label>
            <input
              type="email"
              class="form-control custom-input"
              formControlName="email"
              placeholder="Digite o email"
              aria-label="Email"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label label text-start"
              >Tempo de Empresa (anos):</label
            >
            <input
              type="number"
              class="form-control custom-input"
              formControlName="tempo"
              placeholder="Tempo de empresa"
              min="0"
              aria-label="Tempo de empresa em anos"
            />
          </div>
        </div>

        <!-- Seção de Dados Profissionais (duas colunas em md+) -->
        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <label class="form-label label text-start">Área:</label>
            <input
              type="text"
              class="form-control custom-input"
              formControlName="area"
              placeholder="Área de atuação"
              aria-label="Área de atuação"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label label text-start">Cargo:</label>
            <input
              type="text"
              class="form-control custom-input"
              formControlName="cargo"
              placeholder="Cargo"
              aria-label="Cargo"
            />
          </div>
        </div>

        <!-- Campo único: Unidade -->
        <div class="row g-3 mb-4">
          <div class="col-12">
            <label class="form-label label text-start">Unidade:</label>
            <input
              type="text"
              class="form-control custom-input"
              formControlName="unidade"
              placeholder="Cidade/Unidade"
              aria-label="Cidade ou unidade"
            />
          </div>
        </div>

        <!-- Botão de submit -->
        <div class="text-center mb-3">
          <button class="button-login" type="submit" [disabled]="loading">
            <a href="login" class="text-light ">
              {{ loading ? "Cadastrando..." : "Cadastrar" }}
            </a>
          </button>
        </div>
        <div class="text-center">
          <a href="login">Já tem conta? Faça o login!</a>
        </div>

        <!-- Mensagens de feedback -->
        @if (sucesso) {
        <div class="mt-3 text-success text-center">
          Colaborador cadastrado com sucesso!
        </div>
        } @if (erroMsg) {
        <div class="mt-3 text-danger text-center">
          {{ erroMsg }}
        </div>
        }
      </form>
    </div>
  </div>

  <!-- Footer FarmaNa -->
  <div class="row justify-content-center mt-4">
    <div class="col-12 text-end me-5">
      <h2 class="title-farmana">FarmaNa</h2>
    </div>
  </div>
</div>
