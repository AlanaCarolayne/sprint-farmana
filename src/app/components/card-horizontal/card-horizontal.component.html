
@if (item.tipo ==='horizontal'){
<div class="custom-card horizontal-card">
  <div class="img-container">
    <img src={{item.imagem}} alt="Avatar" />
  </div>
  <div class="content">
    <h3 class="card-title">{{item.titulo}}</h3>
    <small>{{item.dataHora}}</small>
    <p>{{item.descricao}}</p>
  </div>
</div>
}
