@if (item.tipo === 'treinamento') {
  <div class="custom-card vertical-card">
    <div class="img-container" *ngIf="item.imagem">
      <img [src]="item.imagem" alt="Imagem do card" />
    </div>
    <div class="content">
      <h5 class="card-title">{{ item.titulo }}</h5>
      <p>{{ item.descricao }}</p>
      <small class="text-muted">{{ item.dataHora }}</small>
    </div>
  </div>
}
