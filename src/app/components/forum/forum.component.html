<div class="container my-4">
  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-outline-primary d-flex align-items-center gap-2">
      <i class="bi bi-funnel"></i> Filtros
    </button>
  </div>

  <div *ngFor="let ideia of ideias" class="post p-3 mb-4 card-post">
    <h5 class="fw-bold mb-2 fs-3">
      <i class="bi bi-person-circle me-2 title-farmana"></i>
      {{ ideia.idColaborador }} - {{ ideia.areaAfetada }}
    </h5>

    <small class="text-muted">Publicado em: {{ ideia.dataHora }}</small>
    <h4 class="fw-semibold mb-2">{{ ideia.titulo }}</h4>

    <p class="mb-3 p-2">
      {{ ideia.descricao }}
    </p>

    <div *ngIf="ideia.imagem" class="mb-3">
      <img
        [src]="ideia.imagem"
        alt="Imagem da ideia"
        class="img-fluid rounded"
      />
    </div>

    <div class="d-flex gap-4 align-items-center justify-content-end mt-3">
  <button 
    class="btn btn-outline-primary px-4" 
    [ngClass]="{'liked': isLiked(ideia.id)}" 
    (click)="toggleLike(ideia.id)">
    <i class="bi bi-hand-thumbs-up"></i> {{ ideia.likes || 0 }} 
  </button>

  <button 
    class="btn btn-outline-primary px-4" 
    [ngClass]="{'liked': isShared(ideia.id)}" 
    (click)="toggleShare(ideia.id)">
    <i class="bi bi-chat"></i> {{ ideia.share || 0 }}  
  </button>

  <button 
    class="btn btn-outline-primary px-4" 
    [ngClass]="{'liked': isCommented(ideia.id)}" 
    (click)="toggleComment(ideia.id)">
    <i class="bi bi-repeat"></i> {{ ideia.comments || 0 }}
  </button>
</div>

</div>
